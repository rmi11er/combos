[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "combos-shadow"
version = "0.1.0"
description = "Replayable combo-market research and shadow-trading infrastructure"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.34,<3",
  "matplotlib>=3.8,<4",
  "pandas>=2.2,<4",
  "duckdb>=1.0,<2",
  "PyYAML>=6,<7",
  "cryptography>=42,<47",
  "websockets>=12,<16",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.8,<1",
  "mypy>=1.10,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["runs", "data", "__pycache__"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[project.scripts]
combos-runtime = "combos.cli:main"
