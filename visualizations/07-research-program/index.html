}

}

.form-range:disabled {

}

}

  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;script&gt;
(() =&gt; {
  const root=document.getElementById(&#x27;combo-research-atlas&#x27;);

  const NS=&#x27;http://www.w3.org/2000/svg&#x27;;
  const color=i=&gt;`var(--viz-series-${i+1})`;
  function node(tag,attrs={},text=null){const n=document.createElementNS(NS,tag);Object.entries(attrs).forEach(([k,v])=&gt;n.setAttribute(k,v));if(text!==null)n.textContent=text;return n;}
  const charts=[];
  function plot(section,title,labels,series,unit,range=null){
    const figure=document.createElement(&#x27;figure&#x27;),caption=document.createElement(&#x27;figcaption&#x27;);caption.textContent=title;figure.append(caption);

    const svg=node(&#x27;svg&#x27;,{class:&#x27;atlas-chart&#x27;,role:&#x27;img&#x27;,&#x27;aria-label&#x27;:`${title}. ${unit}. Exact values follow the chart.`});figure.append(svg);
    const detail=document.createElement(&#x27;details&#x27;),summary=document.createElement(&#x27;summary&#x27;);summary.textContent=&#x27;Exact values and sample counts&#x27;;detail.append(summary);
    const table=document.createElement(&#x27;table&#x27;);table.className=&#x27;text-small&#x27;;const head=document.createElement(&#x27;tr&#x27;);
    [&#x27;Bin&#x27;,...series.map(s=&gt;s.name)].forEach(t=&gt;{const th=document.createElement(&#x27;th&#x27;);th.textContent=t;head.append(th)});table.append(head);
    labels.forEach((label,j)=&gt;{const tr=document.createElement(&#x27;tr&#x27;);[label,...series.map(s=&gt;s.values[j]==null?&#x27;Unavailable&#x27;:`${s.values[j].toFixed(3)}${s.counts?&#x27; · n=&#x27;+s.counts[j]:&#x27;&#x27;}`)].forEach(t=&gt;{const td=document.createElement(&#x27;td&#x27;);td.textContent=t;tr.append(td)});table.append(tr)});detail.append(table);figure.append(detail);
    root.querySelector(`#atlas-${section} .atlas-plots`).append(figure);
    function draw(){
      const w=Math.max(280,figure.clientWidth),h=260,left=54,right=18,top=34,bottom=46;
      svg.setAttribute(&#x27;viewBox&#x27;,`0 0 ${w} ${h}`);svg.replaceChildren();svg.append(node(&#x27;title&#x27;,{},title));
      const all=series.flatMap(s=&gt;s.values).filter(v=&gt;v!==null&amp;&amp;Number.isFinite(v));
      let lo=range?range[0]:Math.min(0,...all),hi=range?range[1]:Math.max(0,...all);if(hi===lo)hi=lo+1;
      if(!range){const pad=(hi-lo)*.12;lo-=pad;hi+=pad;}
      const x=j=&gt;left+j*(w-left-right)/Math.max(1,labels.length-1),y=v=&gt;top+(hi-v)*(h-top-bottom)/(hi-lo);
      svg.append(node(&#x27;text&#x27;,{x:left,y:18,class:&#x27;text-small&#x27;},unit));
      for(let t=0;t&lt;=4;t++){const v=lo+(hi-lo)*t/4;svg.append(node(&#x27;line&#x27;,{x1:left,x2:w-right,y1:y(v),y2:y(v),class:&#x27;atlas-grid&#x27;}));svg.append(node(&#x27;text&#x27;,{x:left-8,y:y(v)+4,&#x27;text-anchor&#x27;:&#x27;end&#x27;,class:&#x27;text-small&#x27;},v.toFixed(Math.max(Math.abs(lo),Math.abs(hi))&gt;10?0:2)));}
      labels.forEach((label,j)=&gt;{svg.append(node(&#x27;text&#x27;,{x:x(j),y:h-18,&#x27;text-anchor&#x27;:j===0?&#x27;start&#x27;:j===labels.length-1?&#x27;end&#x27;:&#x27;middle&#x27;,class:&#x27;text-small&#x27;},label));});
      series.forEach((s,i)=&gt;{
        let path=&#x27;&#x27;;s.values.forEach((v,j)=&gt;{if(v===null){path+=&#x27; &#x27;;return;}const previous=j&gt;0&amp;&amp;s.values[j-1]!==null;path+=`${previous?&#x27;L&#x27;:&#x27;M&#x27;}${x(j)},${y(v)} `});
        svg.append(node(&#x27;path&#x27;,{d:path,fill:&#x27;none&#x27;,stroke:color(i),&#x27;stroke-width&#x27;:2,&#x27;stroke-dasharray&#x27;:i%2?&#x27;5 3&#x27;:&#x27;none&#x27;}));
        s.values.forEach((v,j)=&gt;{if(v===null){if(series.length===1)svg.append(node(&#x27;text&#x27;,{x:x(j),y:h-bottom-10,&#x27;text-anchor&#x27;:j===0?&#x27;start&#x27;:j===labels.length-1?&#x27;end&#x27;:&#x27;middle&#x27;,class:&#x27;text-small&#x27;},&#x27;n=0&#x27;));return;}const mark=node(i%2?&#x27;rect&#x27;:&#x27;circle&#x27;,i%2?{x:x(j)-3,y:y(v)-3,width:6,height:6,fill:color(i)}:{cx:x(j),cy:y(v),r:3,fill:color(i)});mark.setAttribute(&#x27;data-tooltip&#x27;,`${s.name}: ${v.toFixed(3)} ${unit}${s.counts?&#x27; · n=&#x27;+s.counts[j]:&#x27;&#x27;}`);svg.append(mark)});
      });

  const horizons=[&#x27;60&#x27;,&#x27;300&#x27;,&#x27;900&#x27;,&#x27;3600&#x27;,&#x27;close&#x27;],hl=[&#x27;1m&#x27;,&#x27;5m&#x27;,&#x27;15m&#x27;,&#x27;60m&#x27;,&#x27;Close&#x27;];

    const rows=bins.map(b=&gt;data.markout_cuts.find(r=&gt;matching(r,dim)&amp;&amp;r[dim]===b));

  });

  [&#x27;nfl&#x27;,&#x27;mlb&#x27;].forEach(sport=&gt;{

    {name:&#x27;After entry spread + leg fees&#x27;,values:[0,.035,.07].map(rate=&gt;data.hedges.find(r=&gt;r.period===&#x27;test&#x27;&amp;&amp;r.mode===&#x27;entry_delta_friction&#x27;&amp;&amp;r.leg_fee_coefficient===rate).mean_cents)},

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
